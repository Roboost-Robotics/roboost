; Roboost firmware: one project, one environment per board.
;   pio run -e motor_board -t upload
;   pio run -e sensor_board -t upload
;   pio test -e native          (host unit tests for kinematics / PID / lidar parser)

[platformio]
default_envs = motor_board, sensor_board

[esp32]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_microros_distro = jazzy
; WiFi/UDP transport lives in src/common/uros.cpp (WiFiUDP can't send a full LaserScan)
board_microros_transport = custom
; 2 KB MTU so LaserScan / Odometry fit into one best-effort packet
board_microros_user_meta = microros.meta
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:motor_board]
extends = esp32
build_src_filter = +<common/> +<motor_board/>
lib_deps =
    ${esp32.lib_deps}
    madhephaestus/ESP32Encoder @ ^0.11.0

[env:sensor_board]
extends = esp32
build_src_filter = +<common/> +<sensor_board/>

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
