# slam_toolbox online async mapping; everything not listed uses slam_toolbox defaults.
slam_toolbox:
  ros__parameters:
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    resolution: 0.05
    max_laser_range: 10.0
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    map_update_interval: 2.0
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
